<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Agent</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="shell">
    <!-- Header -->
    <header class="header">
      <div>
        <h1 class="title">Antigravity Agent</h1>
        <div class="status-row">
          <span class="status-dot" id="status-dot"></span>
          <span class="status-text" id="connection-status">Checking connection...</span>
        </div>
      </div>
      <button class="btn btn-secondary btn-sm" id="open-settings">Settings</button>
    </header>

    <!-- Connection Setup (Shown only when not connected) -->
    <section class="section" id="connect-section" style="display: none;">
      <div class="section-head">
        <h2>Connection</h2>
      </div>
      <p class="description">Sign in with your Google Antigravity account to run autonomous agent tasks.</p>
      <div class="stack">
        <button id="signin-antigravity-btn" class="btn btn-primary btn-block">
          <svg width="14" height="14" viewBox="0 0 24 24" style="margin-right: 4px; flex-shrink: 0;">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
          </svg>
          Sign in with Google Antigravity
        </button>
      </div>
    </section>

    <!-- Main View -->
    <main id="main-view">
      <!-- Task Presets -->
      <section class="section">
        <div class="preset-group">
          <button class="preset-btn" data-prompt="Search OnlineJobs.ph for Full-Stack Developer jobs, inspect the top matches, and prepare tailored applications.">OnlineJobs.ph</button>
          <button class="preset-btn" data-prompt="Search Upwork for Python or React jobs with verified payment, examine client questions, and draft proposal.">Upwork</button>
          <button class="preset-btn" data-prompt="Read the job posting on this page, tailor Mark's resume to match the requirements, and generate a tailored PDF.">Tailor resume</button>
          <button class="preset-btn" data-prompt="Fill out this entire form accurately using Mark Renier Fostanes's profile details.">Fill form</button>
          <button class="preset-btn" data-prompt="Read all questions and multiple-choice options on this page and select the correct answer for each.">Solve quiz</button>
        </div>
      </section>

      <!-- Task Input -->
      <section class="section">
        <div class="field">
          <label class="label" for="goal-input">Task</label>
          <textarea 
            id="goal-input" 
            class="input textarea" 
            rows="3" 
            placeholder="Describe the task to execute on this page..."
          ></textarea>
        </div>

        <div class="options-row">
          <label class="checkbox-label" title="Capture viewport screenshots for multimodal inspection">
            <input type="checkbox" id="toggle-vision" checked>
            <span>Multimodal vision</span>
          </label>
          <label class="checkbox-label" title="Pause for confirmation before spending connects or final submission">
            <input type="checkbox" id="toggle-safety" checked>
            <span>Review before submit</span>
          </label>
        </div>

        <div class="action-bar">
          <select id="quick-model-select" class="select">
            <option value="gemini-3.8-flash-tiered">Gemini 3.8 Flash</option>
            <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
            <option value="gemini-pro-agent">Gemini Pro Agent</option>
          </select>
          <button id="run-btn" class="btn btn-primary">Run agent</button>
        </div>
      </section>

      <!-- Execution Log -->
      <section class="section" id="stream-section" style="display: none;">
        <div class="section-head">
          <h2>Execution</h2>
          <span id="step-counter" class="step-label">Step 1</span>
        </div>

        <div class="log-box">
          <p class="thought-text" id="stream-thought">Perceiving page elements and viewport...</p>
          <div class="action-text" id="stream-action"></div>
          <div class="log-list" id="stream-logs"></div>
        </div>

        <!-- Human Confirmation -->
        <div class="confirm-box" id="confirm-box" style="display: none;">
          <p id="confirm-msg" class="confirm-text">Confirmation required for this action.</p>
          <div class="confirm-actions">
            <button id="confirm-yes" class="btn btn-primary btn-sm">Confirm action</button>
            <button id="confirm-no" class="btn btn-secondary btn-sm">Cancel</button>
          </div>
        </div>

        <button id="stop-btn" class="btn btn-danger btn-block">Stop agent</button>
      </section>
    </main>

    <!-- Settings View -->
    <section class="section" id="settings-view" style="display: none;">
      <div class="section-head">
        <h2>Settings</h2>
        <button id="close-settings" class="btn btn-ghost btn-sm">Back</button>
      </div>

      <div class="stack">
        <div class="field">
          <label class="label" for="setting-mode">Connection provider</label>
          <select id="setting-mode" class="select">
            <option value="token">Google Antigravity</option>
          </select>
        </div>

        <div class="field" id="group-account">
          <label class="label">Google Antigravity account</label>
          <div id="account-signed-in" style="display: none;" class="stack">
            <div class="card-status-box">
              <span class="status-dot" data-tone="success"></span>
              <span id="account-project-label">Connected</span>
            </div>
            <button id="signout-antigravity-btn" class="btn btn-danger btn-block">Sign out</button>
          </div>
          <div id="account-signed-out">
            <button id="signin-settings-btn" class="btn btn-secondary btn-block">Sign in with Google Antigravity</button>
          </div>
        </div>

        <div class="field">
          <label class="label" for="setting-model">Default model</label>
          <select id="setting-model" class="select">
            <option value="gemini-3.8-flash-tiered">Gemini 3.8 Flash</option>
            <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
            <option value="gemini-pro-agent">Gemini Pro Agent</option>
          </select>
        </div>

        <button id="save-settings-btn" class="btn btn-primary btn-block">Save settings</button>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
