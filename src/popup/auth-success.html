<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Connected to Google Antigravity</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      background: #0a0a0b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 36px 32px;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .badge {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(71, 205, 137, 0.15);
      color: #47cd89;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      font-size: 22px;
      font-weight: 700;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0 0 10px 0;
    }
    p {
      font-size: 14px;
      color: #a1a1aa;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .btn {
      display: inline-block;
      background: #fafafa;
      color: #0a0a0b;
      font-weight: 500;
      font-size: 13px;
      padding: 8px 18px;
      border-radius: 6px;
      border: 1px solid #fafafa;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 140ms ease-out;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">✓</div>
    <h1>Connected to Google Antigravity</h1>
    <p>Authentication succeeded. Your browser agent is now connected to Antigravity and configured with Gemini 3.8 Flash.</p>
    <button class="btn" onclick="window.close()">Close this tab</button>
  </div>
</body>
</html>
